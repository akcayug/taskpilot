version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-taskpilot}
      POSTGRES_USER: ${DB_USER:-taskpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DJANGO_SETTINGS_MODULE: taskpilot.settings
      DATABASE_URL: postgresql://${DB_USER:-taskpilot}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-taskpilot}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.taskpilot-web.rule=Host(`taskpilot.ugurakcay.com`)"
      - "traefik.http.routers.taskpilot-web.entrypoints=https"
      - "traefik.http.routers.taskpilot-web.tls=true"
      - "traefik.http.routers.taskpilot-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.taskpilot-web.service=taskpilot-web"
      - "traefik.http.services.taskpilot-web.loadbalancer.server.port=8000"
      - "traefik.http.routers.taskpilot-web-http.rule=Host(`taskpilot.ugurakcay.com`)"
      - "traefik.http.routers.taskpilot-web-http.entrypoints=http"
      - "traefik.http.routers.taskpilot-web-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      DJANGO_SETTINGS_MODULE: taskpilot.settings
      DATABASE_URL: postgresql://${DB_USER:-taskpilot}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-taskpilot}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEB_URL: ${WEB_URL:-http://web:8000}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DJANGO_SETTINGS_MODULE: taskpilot.settings
      DATABASE_URL: postgresql://${DB_USER:-taskpilot}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-taskpilot}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
