<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - TaskPilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5 text-center">
                        <div class="mb-4">
                            <i data-lucide="check-circle" class="text-success" style="width: 64px; height: 64px;"></i>
                        </div>
                        <h1 class="h3 mb-3">Welcome to TaskPilot!</h1>
                        <p class="text-muted mb-4">
                            Your account has been created successfully.<br>
                            You're now a member of <strong>{{ tenant.name }}</strong>.
                        </p>
                        <a href="{% url 'login' %}" class="btn btn-primary">
                            <i data-lucide="log-in" class="icon-sm"></i>
                            Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
